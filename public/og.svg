<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1200"
    height="630"
    viewBox="0 0 1200 630"
    fill="none"
>
  <title>Gib — Full-Stack Edge Application Template</title>
  <defs>
    <radialGradient id="glow-bottom-left" cx="22%" cy="84%" r="58%">
      <stop offset="0%" stop-color="#1f9d55" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#080e0a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-top-right" cx="80%" cy="16%" r="52%">
      <stop offset="0%" stop-color="#19665c" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#080e0a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="emblem-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39d977" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#39d977" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="glass-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2920" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#0e1712" stop-opacity="0.88" />
    </linearGradient>
    <linearGradient id="featured-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#195c34" />
      <stop offset="100%" stop-color="#0f351f" />
    </linearGradient>
    <filter id="blur-soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="630" fill="#080e0a" />
  <rect width="1200" height="630" fill="url(#glow-bottom-left)" />
  <rect width="1200" height="630" fill="url(#glow-top-right)" />

  <!-- Subtle architectural grid lines -->
  <g stroke="#d5ebe0" stroke-opacity="0.05" stroke-width="1">
    <line x1="96" y1="0" x2="96" y2="630" />
    <line x1="1104" y1="0" x2="1104" y2="630" />
    <line x1="0" y1="84" x2="1200" y2="84" />
    <line x1="0" y1="546" x2="1200" y2="546" />
  </g>

  <!-- Connector between Emblem Node and Hub Node -->
  <path
        d="M 276 266 C 324 256, 368 276, 412 266"
        stroke="#39d977"
        stroke-opacity="0.2"
        stroke-width="8"
    />
  <path
        d="M 276 266 C 324 276, 368 256, 412 266"
        stroke="#39d977"
        stroke-opacity="0.45"
        stroke-width="1.25"
    />
  <path
        d="M 276 266 C 324 256, 368 276, 412 266"
        stroke="#39d977"
        stroke-width="2"
    />

  <!-- Converging bottom connectors -->
  <path
        d="M 758 372 C 758 408, 600 398, 600 442"
        stroke="#39d977"
        stroke-opacity="0.2"
        stroke-width="8"
    />
  <path
        d="M 758 372 C 758 408, 600 398, 600 442"
        stroke="#39d977"
        stroke-width="2"
    />

  <!-- Emblem Node (Left) -->
  <g transform="translate(96, 176)">
    <path
            d="M -8 28 V 24 C -8 7.43 5.43 -6 22 -6 H 26"
            stroke="#39d977"
            stroke-opacity="0.55"
            stroke-width="1.5"
            stroke-linecap="round"
        />
    <rect
            x="0"
            y="0"
            width="180"
            height="180"
            rx="24"
            fill="none"
            stroke="#39d977"
            stroke-opacity="0.48"
            stroke-width="1.25"
        />
    <rect
            x="10"
            y="10"
            width="160"
            height="160"
            rx="16"
            fill="url(#glass-fill)"
            stroke="#39d977"
            stroke-opacity="0.42"
            stroke-width="1.25"
        />
    <circle
            cx="90"
            cy="90"
            r="52"
            fill="url(#emblem-halo)"
            filter="url(#blur-soft)"
        />
    <g transform="translate(46, 46) scale(0.458333)">
      <path
                fill="#eff5f1"
                d="M 96,192 0,96 96,0 192,96 Z m 0,-30.86644 65.13341,-65.13342 L 96,30.866577 30.866582,96 Z m 0,-50.48494 q -5.75476,0 -9.67846,-3.66212 -3.9237,-3.66212 -3.9237,-10.98636 0,-7.58582 3.9237,-10.98636 3.9237,-3.66212 9.67846,-3.66212 5.2316,0 9.1553,3.66212 4.18528,3.40054 4.18528,10.98636 0,7.32424 -4.18528,10.98636 -3.9237,3.66212 -9.1553,3.66212 z"
            />
    </g>
    <!-- Right Port -->
    <rect x="178" y="72" width="4" height="36" rx="2" fill="#39d977" />
  </g>

  <!-- Main Hub Node (Right) -->
  <g transform="translate(412, 146)">
    <path
            d="M -8 28 V 24 C -8 7.43 5.43 -6 22 -6 H 26"
            stroke="#39d977"
            stroke-opacity="0.55"
            stroke-width="1.5"
            stroke-linecap="round"
        />
    <rect
            x="0"
            y="0"
            width="692"
            height="226"
            rx="24"
            fill="none"
            stroke="#39d977"
            stroke-opacity="0.48"
            stroke-width="1.25"
        />
    <rect
            x="10"
            y="10"
            width="672"
            height="206"
            rx="16"
            fill="url(#glass-fill)"
            stroke="#39d977"
            stroke-opacity="0.38"
            stroke-width="1.25"
        />

    <!-- Left & Bottom Ports -->
    <rect x="-2" y="102" width="4" height="36" rx="2" fill="#39d977" />
    <rect x="328" y="224" width="36" height="4" rx="2" fill="#39d977" />

    <!-- Small Brand Mark + Heading -->
    <rect
            x="44"
            y="42"
            width="42"
            height="42"
            rx="10"
            fill="#0b130e"
            stroke="#39d977"
            stroke-opacity="0.35"
            stroke-width="1"
        />
    <g transform="translate(53, 51) scale(0.125)">
      <path
                fill="#39d977"
                d="M 96,192 0,96 96,0 192,96 Z m 0,-30.86644 65.13341,-65.13342 L 96,30.866577 30.866582,96 Z m 0,-50.48494 q -5.75476,0 -9.67846,-3.66212 -3.9237,-3.66212 -3.9237,-10.98636 0,-7.58582 3.9237,-10.98636 3.9237,-3.66212 9.67846,-3.66212 5.2316,0 9.1553,3.66212 4.18528,3.40054 4.18528,10.98636 0,7.32424 -4.18528,10.98636 -3.9237,3.66212 -9.1553,3.66212 z"
            />
    </g>

    <text
            x="104"
            y="75"
            fill="#eff5f1"
            font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
            font-size="38"
            font-weight="600"
            letter-spacing="-0.02em"
        >
      Gib
    </text>
    <text
            x="44"
            y="122"
            fill="#b6c9be"
            font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
            font-size="22"
            font-weight="400"
        >
      Full-stack edge application template powered by
    </text>
    <text
            x="44"
            y="154"
            fill="#b6c9be"
            font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
            font-size="22"
            font-weight="400"
        >
      React, Hono, and Cloudflare Workers.
    </text>

    <!-- Stack Pills -->
    <g
            transform="translate(44, 174)"
            font-family="Geist Mono, ui-monospace, monospace"
            font-size="13"
            font-weight="500"
        >
      <rect
                x="0"
                y="0"
                width="92"
                height="26"
                rx="13"
                fill="#15241b"
                stroke="#39d977"
                stroke-opacity="0.35"
            />
      <text x="46" y="17" text-anchor="middle" fill="#b6c9be">React 19</text>

      <rect
                x="104"
                y="0"
                width="96"
                height="26"
                rx="13"
                fill="#15241b"
                stroke="#39d977"
                stroke-opacity="0.35"
            />
      <text x="152" y="17" text-anchor="middle" fill="#b6c9be">Base UI</text>

      <rect
                x="212"
                y="0"
                width="120"
                height="26"
                rx="13"
                fill="#15241b"
                stroke="#39d977"
                stroke-opacity="0.35"
            />
      <text
                x="272"
                y="17"
                text-anchor="middle"
                fill="#b6c9be"
            >Tailwind v4</text>

      <rect
                x="344"
                y="0"
                width="76"
                height="26"
                rx="13"
                fill="#15241b"
                stroke="#39d977"
                stroke-opacity="0.35"
            />
      <text x="382" y="17" text-anchor="middle" fill="#b6c9be">Hono</text>

      <rect
                x="432"
                y="0"
                width="146"
                height="26"
                rx="13"
                fill="#15241b"
                stroke="#39d977"
                stroke-opacity="0.35"
            />
      <text
                x="505"
                y="17"
                text-anchor="middle"
                fill="#b6c9be"
            >Cloudflare CLI</text>
    </g>
  </g>

  <!-- Featured Quick Clone Node (Bottom) -->
  <g transform="translate(310, 442)">
    <path
            d="M -8 28 V 24 C -8 7.43 5.43 -6 22 -6 H 26"
            stroke="#39d977"
            stroke-opacity="0.65"
            stroke-width="1.5"
            stroke-linecap="round"
        />
    <rect
            x="0"
            y="0"
            width="580"
            height="84"
            rx="24"
            fill="none"
            stroke="#39d977"
            stroke-opacity="0.52"
            stroke-width="1.25"
        />
    <rect
            x="10"
            y="10"
            width="560"
            height="64"
            rx="16"
            fill="url(#featured-fill)"
            stroke="#39d977"
            stroke-opacity="0.48"
            stroke-width="1.25"
        />
    <!-- Top Port -->
    <rect x="272" y="-2" width="36" height="4" rx="2" fill="#39d977" />
    <rect
            x="24"
            y="22"
            width="532"
            height="40"
            rx="10"
            fill="#0a160f"
            fill-opacity="0.55"
            stroke="#8de8b0"
            stroke-opacity="0.28"
            stroke-width="1"
        />
    <text
            x="44"
            y="47"
            fill="#9fd0b4"
            font-family="Geist Mono, ui-monospace, monospace"
            font-size="16"
        >$</text>
    <text
            x="66"
            y="47"
            fill="#f3faf5"
            font-family="Geist Mono, ui-monospace, monospace"
            font-size="16"
            letter-spacing="0.02em"
        >
      git clone git@github.com:zerdalu/gib.git my-app
    </text>
  </g>
</svg>
